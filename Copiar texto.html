<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copiar texto</title>
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
  --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --border: #e2e2e7;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111114; --card: #1c1c21; --text: #f2f2f5; --muted: #9a9aa3;
    --accent: #3b82f6; --accent-text: #ffffff; --ok: #22c55e; --border: #2e2e36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111114; --card: #1c1c21; --text: #f2f2f5; --muted: #9a9aa3;
  --accent: #3b82f6; --accent-text: #ffffff; --ok: #22c55e; --border: #2e2e36;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding: 24px;
}
.card {
  width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px 24px; text-align: center;
}
.label { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
#texto {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 20px; font-weight: 600; word-break: break-all; user-select: all;
  margin: 0 0 24px;
}
button {
  width: 100%; padding: 14px 16px; font-size: 16px; font-weight: 600; border: 0;
  border-radius: 12px; background: var(--accent); color: var(--accent-text); cursor: pointer;
  transition: background .2s;
}
button.ok { background: var(--ok); }
</style>
</head>
<body>
<div class="card">
  <div class="label">Key</div>
  <p id="texto">key_user8_freekeys83</p>
  <button id="btn" type="button">Copiar texto</button>
</div>
<script>
(function () {
  var btn = document.getElementById('btn');
  var texto = document.getElementById('texto').textContent;
  function listo() {
    btn.textContent = '¡Copiado!';
    btn.classList.add('ok');
    setTimeout(function () {
      btn.textContent = 'Copiar texto';
      btn.classList.remove('ok');
    }, 2000);
  }
  function respaldo() {
    var ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); listo(); } catch (e) { btn.textContent = 'Selecciona y copia a mano'; }
    document.body.removeChild(ta);
  }
  btn.addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(listo, respaldo);
    } else {
      respaldo();
    }
  });
})();
</script>
</body>
</html>
